name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-27:
    # Needs a self-hosted macOS 27 runner labelled `macos-27` (GitHub-hosted runners lack
    # Xcode 27). Skipped until the repository variable HAS_MACOS27_RUNNER is `true`.
    if: >-
      vars.HAS_MACOS27_RUNNER == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, macos-27]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: swift --version
      - run: Scripts/test.sh
      - run: Scripts/conformance.sh "$RUNNER_TEMP/conformance"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance
