name: Experimental SwiftNIO fork early-EOF proof
on:
  push:
    branches: [spike/swiftnio-early-eof-consumer]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nio-fork-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-27:
    if: vars.HAS_MACOS27_RUNNER == 'true'
    runs-on: [self-hosted, macOS, macos-27]
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SWIFT_MCP_SERVER_READ_TOKEN }}@github.com/ThorFuchs/Swift-MCP-Server.git.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/ThorFuchs/Swift-MCP-Server.git
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: bash Scripts/qualify-nio-fork-macos27.sh
